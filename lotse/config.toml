# Lotse – alle Einstellungen. Keine Zahl aus dieser Datei steht im Code.
# Modus: VORSCHLAG (nur Tagebuch + Push) -> PAPER -> ECHT. Committet wird immer nur VORSCHLAG.
modus = "VORSCHLAG"              # VORSCHLAG | PAPER | ECHT

[wertpapiere]
# Gewählt am 10.10.2026 (Begründung + Alternativen: lotse/WERTPAPIERE.md).
# Die Reihenfolge zählt: das erste Wertpapier ist "Wertpapier 1" (Regel 10).
aktien    = "SSAC"
anleihen  = "CSBGC7"

[ziel]
# Prozent je Wertpapier, gleiche Namen wie oben. Summe = 100.
aktien   = 85
anleihen = 15

[grenzen]
budget_chf          = 300     # CHF, so viel darf Lotse insgesamt einsetzen (Regel 7) – trennt Lotse vom Geld von Bot C.
                              # 0 = kein Budget: Lotse rechnet mit dem ganzen CHF-Cash (später, wenn Lotse allein auf dem Konto ist)
max_einzahlung_pro_lauf = 3000  # CHF, nur bei budget_chf = 0: grössere Einzahlung seit dem letzten Lauf -> Regel 0, bestätigen
mindestbetrag       = 100     # CHF, keine Order mit kleinerem Orderbetrag
schwelle            = 5       # Prozentpunkte, ab wann umgeschichtet wird
mindestdepot        = 2000    # CHF, darunter nur Wertpapier 1
puffer_prozent      = 1       # Prozent vom Grundbetrag min(Cash, Budget − investiert), bleibt zusätzlich zur Gebühr liegen
max_pro_order       = 500     # CHF
max_pro_tag         = 1000    # CHF
max_orders_pro_tag  = 3

[abbau]
# Wertpapiere hier werden nur noch verkauft, nie gekauft (Regel 13)
liste = []

[dividenden]
# Ausschüttungen eigener Papiere senken "investiert". Quelle: IBKR Flex-Abfrage (Cash Transactions).
# Query-ID hier, den Flex-Token NIE hier, sondern in deploy/.env als LOTSE_FLEX_TOKEN. Leer = nicht erfassen.
flex_query_id = ""

[gebuehren]
# Schätzung für Regel 7. IBKR-Gebühr für SIX-Orders vor dem ersten PAPER-Lauf in der Gebührentabelle prüfen.
pro_order = 3                 # CHF je Order

[ausfuehren]
limit_abstand_prozent = 1.5   # Regel 20: Limit so viel über (Kauf) bzw. unter (Verkauf) dem letzten Kurs.
                              # Ein Kauf-Limit über dem Markt füllt zum Briefkurs, nicht zum Limit – der Abstand kostet
                              # im Normalfall nichts, deckt Kursbewegungen seit dem letzten Kurs ab und fängt grobe Fehler ab.
bruchstueck_stellen   = 4     # Nachkommastellen bei Stück (IBKR erlaubt Bruchstücke für SIX-ETFs; 0 = nur ganze)

[kurse]
# Kurse holt Lotse über quantdesk.marketdata (wie Bot C), ohne IBKR – die SIX liefert ohne Marktdaten-Abo keine
# Kurse. Reihenfolge der Quellen: Stooq, dann Yahoo. Je Papier das Symbol pro Quelle; "" = Quelle überspringen.
# Stooq nennt keine Währung (-> Regel 0) und ist oft blockiert, deshalb für die SIX-Papiere abgeschaltet.
# Orders laufen immer über IBKR an der SIX (EBS).

[kurse.symbole]
SSAC   = { yahoo = "SSAC.SW", stooq = "" }
CSBGC7 = { yahoo = "CSBGC7.SW", stooq = "" }

[verbindung]
# IB Gateway (Paper). Bot C benutzt Client-ID 17 – Lotse eine eigene.
host      = "ib-gateway"
port      = 4004
client_id = 27
konto     = "DUO844164"       # muss mit DU beginnen (nur Paper)
boerse    = "EBS"             # SIX Swiss Exchange bei IBKR
waehrung  = "CHF"

[zeitplan]
# Täglich an SIX-Handelstagen (Börsenkalender XSWX, ohne Feiertage). Eine nicht ausgeführte Order wird so am
# nächsten Tag neu gestellt, Einzahlungen werden innert eines Tages erkannt. Gehandelt wird trotzdem selten (Regel 9).
uhrzeit              = "10:30"
zeitzone             = "Europe/Zurich"
nachholen_bis        = "17:00"   # Container startet erst später (Neustart)? Heutigen Lauf bis dann nachholen
lauf_timeout_minuten = 20

[push]
thema = "lotse"               # eigenes ntfy-Thema; Adresse und Token kommen aus der Umgebung (NTFY_URL, NTFY_TOKEN)

[ablage]
ordner = "lotse-daten"        # Tagebuch, Zähler (auf dem Server: /state-lotse)
