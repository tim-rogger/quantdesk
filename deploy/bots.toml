# Bot-Register für die Systemseite (/system im Dashboard).
# Ein neuer Bot = ein neuer [[bot]]-Eintrag hier. Keine Codeänderung nötig.
# Gelesen wird nur – der Sammler schreibt nie in die Dateien eines Bots.
#
# Pfade sind relativ zu deploy/ auf dem Server (z.B. "state/data/status.json").
#
# Allgemeine Felder:
#   strategie_kurz  drei Wörter für die Karte auf der Übersicht
#   detail        optional: Id eines Zusatz-Blocks in dashboard/static/index.html (detail-<name>)
#   container     Name des Docker-Compose-Dienstes, in dem der Bot läuft – erscheint als Kasten in der Skizze
#   laeufe        geplante Uhrzeiten (Mo–Fr) in `zeitzone`. Börsenfeiertage kennt der Sammler nicht.
#   eingerichtet  false = grauer Kasten "noch nicht eingerichtet" (kein Fehler).
#   format        wie die Dateien aussehen (Standard: "laeufe"):
#
# format = "laeufe" (Strategie C):
#   status_datei  JSON-Objekt mit dem aktuellen Stand. Daraus liest der Sammler:
#                   modus_feld       Text, z.B. "PAPER"                         (Standard: mode)
#                   investiert_feld  Zahl                                       (Standard: c_account.invested)
#                   positionen_feld  Liste/Objekt (gezählt) oder Zahl            (Standard: c_account.positions)
#                 Ein Punkt im Namen geht eine Ebene tiefer: "c_account.invested".
#   laeufe_datei  JSONL, eine Zeile pro Lauf, die neueste unten. Felder:
#                   lauf_zeit_feld   Unix-Sekunden ODER ISO-Zeit MIT Zeitzone    (Standard: ts)
#                   lauf_ok_feld     true/false                                 (Standard: ok)
#                   lauf_fehler_feld Liste von Texten                           (Standard: errors)
#
# format = "lotse-tagebuch" (Lotse): mehrere Zeilen pro Lauf (start / kasse / ende), siehe systemstatus/formate.py
#   laeufe_datei         laeufe.jsonl des Tagebuchs
#   ausfuehrungen_datei  ausfuehrungen.jsonl (für die Anzahl Positionen)
#   zeit_ohne_zone       in welcher Zeitzone die Zeiten gemeint sind, wenn sie keine mitbringen
#   orders_datei         orders.jsonl (für den letzten Vorschlag im Klartext)
#   config_datei         Lotses config.toml (für das Budget, [grenzen] budget_chf)
#   lauf_hoechstens_minuten  ein Lauf ohne "ende", der jünger ist, läuft noch; älter = abgestürzt

[[bot]]
id = "c"
name = "Strategie C"
strategie = "Grid 5 × 2 %, SMA200 + Ausstieg"
strategie_kurz = "Grid mit Trendfilter"
eingerichtet = true
container = "bot"
detail = "strategie-c"            # zusätzlicher Inhalt auf der Bots-Seite (Kapitalkurve, Kriterien, Positionen)
status_datei = "state/data/status.json"
laeufe_datei = "state/data/runs.jsonl"
waehrung = "USD"
zeitzone = "America/New_York"
laeufe = ["10:00", "15:30"]

[[bot]]
id = "lotse"
name = "Lotse"
strategie = "Umschichten nach Zielgewichten (SIX-ETFs)"
strategie_kurz = "ETF-Aufteilung 85/15"
eingerichtet = true
container = "lotse"
format = "lotse-tagebuch"
laeufe_datei = "state-lotse/laeufe.jsonl"
ausfuehrungen_datei = "state-lotse/ausfuehrungen.jsonl"
orders_datei = "state-lotse/orders.jsonl"
config_datei = "../lotse/config.toml"   # liegt im Repo, nicht in deploy/
# Lotse schreibt Zeiten ohne Zeitzone (dt.datetime.now()). Im Container gilt TZ=America/New_York (deploy/Dockerfile),
# also sind sie New-York-Zeit. Ändert sich das (Lotse schreibt Zeitzone mit), hier nichts tun – dann zählt die echte.
zeit_ohne_zone = "America/New_York"
lauf_hoechstens_minuten = 25   # Lotses Zeitlimit ist 20 min ([zeitplan] in lotse/config.toml)
waehrung = "CHF"
zeitzone = "Europe/Zurich"
laeufe = ["10:30"]
