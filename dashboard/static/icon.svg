      <stop offset="0" stop-color="#14385e"/>
      <stop offset="1" stop-color="#0a1a2b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grund)"/>
  <circle cx="240" cy="236" r="118" fill="none" stroke="#f0f6fc" stroke-width="46"/>
  <line x1="302" y1="302" x2="366" y2="366" stroke="#3fb950" stroke-width="50" stroke-linecap="round"/>
</svg>
